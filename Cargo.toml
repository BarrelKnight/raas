[package]
name = "raas"
version = "0.1.0"
edition = "2024"
description = "流式 tar 归档下载服务器,支持随机访问和 HTTP Range 请求 (Random Access Archive Stream)"
license = "MIT"

[dependencies]
# HTTP 服务器
axum = { version = "0.8.7", features = ["json", "tokio"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
async-stream = "0.3.6"

# 序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# 归档
tar = "0.4.43"

# 缓存
moka = { version = "0.12.12", features = ["sync"] }

# 错误处理
thiserror = "2.0.17"
anyhow = "1.0.100"

# 日志
tracing = "0.1.43"
tracing-subscriber = "0.3.22"

# 安全
regex = "1.10.0"

# 性能优化
tower = { version = "0.5.1", features = ["limit"] }
bytes = "1.11.0"

[dev-dependencies]
tempfile = "3.23.0"
http-body-util = "0.1"
tower = { version = "0.5.1", features = ["util"] }
serial_test = "3.2.0"
